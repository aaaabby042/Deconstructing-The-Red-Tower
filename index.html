
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Red Tower</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="painting">

    <!-- Background -->
    <div class="sky"></div>
    <div class="land"></div>
    <div class="hills"></div>

    <!-- Distant buildings -->
    <div class="house house-one"></div>
    <div class="house house-two"></div>
    <div class="house house-three"></div>

    <!-- Red tower -->
    <div class="tower">
      <div class="tower-window window-one"></div>
      <div class="tower-window window-two"></div>
      <div class="tower-window window-three"></div>
      <div class="tower-door"></div>
    </div>

    <!-- Horse statue -->
<div class="statue-base"></div>

<div class="horse">
  <div class="horse-body"></div>
  <div class="horse-head"></div>
  <div class="horse-neck"></div>
  <div class="horse-leg leg1"></div>
  <div class="horse-leg leg2"></div>
  <div class="horse-tail"></div>
  <div class="rider"></div>
</div>

<!-- Foreground -->
<div class="left-building">
  <div class="arch left-arch1"></div>
  <div class="arch left-arch2"></div>
</div>

<div class="right-building">
  <div class="arch right-arch1"></div>
  <div class="arch right-arch2"></div>
</div>

<div class="ground"></div>
  </main>
</body>
</html>
